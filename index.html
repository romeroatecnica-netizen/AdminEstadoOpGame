                "@type": "Question",
                "name": "¿Cómo se calcula la puntuación y la penalización 1/3 en el examen C1 Administrativo del Estado?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Cada pregunta tipo test tiene 4 alternativas (A, B, C, D) con una única respuesta correcta. Cada acierto suma 1 punto base, cada fallo penaliza 1/3 del valor de un acierto (-0,333 puntos) y las preguntas en blanco no penalizan. La fórmula es Puntuación Neta = Aciertos - (Fallos / 3)."
                }
              },
              {
                "@type": "Question",
                "name": "¿Cuál es la estructura oficial del ejercicio único de Administrativo del Estado (Turno Libre)?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Consta de un ejercicio único dividido en dos partes obligatorias y eliminatorias: Primera parte de cuestionario teórico-práctico sobre los 6 bloques del temario (incluyendo informática y ofimática), y Segunda parte de supuesto práctico tipo test a elegir entre dos opciones propuestas por el Tribunal sobre los bloques II, III, IV y V, ambas con preguntas de reserva."
                }
              },
              {
                "@type": "Question",
                "name": "¿Cuándo compensa arriesgar en un test con penalización de 1/3?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Matemáticamente, si descartas con seguridad 2 opciones y dudas entre 2 alternativas, la esperanza matemática es positiva (+0,33 puntos por pregunta) y conviene responder. Si dudas entre 3 opciones, la esperanza es ligeramente positiva (+0,11 puntos). Si desconoces totalmente la respuesta entre las 4 opciones, la esperanza matemática es 0 y dejarla en blanco evita varianza negativa."
                }
              },
